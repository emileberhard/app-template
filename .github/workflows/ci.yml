name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    container: swift:6.4.1-noble@sha256:19cbe56bdaec1918f7cf5fdeba42b9bd55bdd8a6149c9990d0e0e3a89a127d63
    steps:
      - name: Check that a private repository names its Mac runner
        if: github.event.repository.private && vars.MAC_CI_RUNNER == ''
        run: |
          echo "::error::Set the MAC_CI_RUNNER variable to this repository's Mac runner labels as a JSON array; private repositories do not compile on billed hosted macOS."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test --package-path Core

  app:
    if: ${{ !github.event.repository.private || vars.MAC_CI_RUNNER != '' }}
    runs-on: ${{ github.event.repository.private && fromJSON(vars.MAC_CI_RUNNER) || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - run: xcodebuild -quiet -project Apple/Starter.xcodeproj -scheme Starter -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath "${{ runner.temp }}/build-${{ github.run_id }}-${{ github.run_attempt }}" -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -skipPackageUpdates CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build
      - name: Remove build output
        if: always()
        run: rm -rf "${{ runner.temp }}/build-${{ github.run_id }}-${{ github.run_attempt }}"
