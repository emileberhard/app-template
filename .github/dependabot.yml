version: 2
updates:
  - package-ecosystem: swift
    directory: /Core
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 1
    groups:
      swift:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 1
    groups:
      actions:
        patterns: ['*']
